<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script src="config.js"></script>
  <script>
    window.onload = function() {
      if (typeof REDIRECT_URL !== 'undefined' && REDIRECT_URL) {
        window.location.href = REDIRECT_URL;
      } else {
        document.getElementById('msg').textContent = 'No redirect URL configured.';
      }
    };
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; background: #f6f8fa; color: #24292f;
    }
    .container { text-align: center; }
    .spinner {
      border: 4px solid #e1e4e8; border-top: 4px solid #0969da;
      border-radius: 50%; width: 40px; height: 40px;
      animation: spin 1s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p id="msg">Redirecting, please wait...</p>
  </div>
</body>
</html>
